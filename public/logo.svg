<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Philosophy: Neobrutalist Stacked Task Clipboard with Momentum Checkmark -->
  <!-- Shadow offset shape -->
  <rect x="22" y="22" width="76" height="84" rx="16" fill="#0f172a" />
  
  <!-- Base card with thick stroke -->
  <rect x="16" y="16" width="76" height="84" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" />
  
  <!-- Top Clipboard Header Clip -->
  <rect x="38" y="10" width="32" height="14" rx="6" fill="#facc15" stroke="#0f172a" stroke-width="3.5" />
  <circle cx="54" cy="17" r="2.5" fill="#0f172a" />
  
  <!-- Task Lines -->
  <rect x="28" y="36" width="36" height="6" rx="3" fill="#cbd5e1" />
  <rect x="28" y="50" width="46" height="6" rx="3" fill="#e2e8f0" />
  <rect x="28" y="64" width="30" height="6" rx="3" fill="#e2e8f0" />
  
  <!-- Neobrutalist Vibrant Checkmark Badge -->
  <circle cx="72" cy="72" r="22" fill="#2563eb" stroke="#0f172a" stroke-width="4" />
  <path d="M62 72L69 79L83 63" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Momentum Sparkle/Star -->
  <path d="M78 28L80 34L86 36L80 38L78 44L76 38L70 36L76 34Z" fill="#facc15" stroke="#0f172a" stroke-width="2" />
</svg>
